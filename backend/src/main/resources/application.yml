spring:
    application:
        name: rbac-dashboards-backend

    # Load the repo-root .env as a property source.
    # Spring Boot does NOT read .env files on its own (Docker Compose does).
    # Both paths are listed so this works whether the working directory is
    # the repo root or backend/. "optional:" means it silently no-ops in
    # production, where real environment variables are injected instead.
    config:
        import:
            - optional:file:./.env[.properties]
            - optional:file:../.env[.properties]

    # Datasource Configuration (PostgreSQL)
    datasource:
        url: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
        username: ${POSTGRES_USER}
        password: ${POSTGRES_PASSWORD}
        driver-class-name: org.postgresql.Driver
        hikari:
            maximum-pool-size: 10
            minimum-idle: 5
            idle-timeout: 300000
            connection-timeout: 20000

    # JPA / Hibernate
    jpa:
        database-platform: org.hibernate.dialect.PostgreSQLDialect
        hibernate:
            ddl-auto: validate # Flyway handles schema creation
        show-sql: true
        properties:
            hibernate:
                format_sql: true

    # Database Migrations (Flyway)
    flyway:
        enabled: true
        baseline-on-migrate: true
        locations: classpath:db/migration

    # MailHog Configuration
    mail:
        host: ${MAIL_HOST}
        port: ${MAIL_PORT}
        properties:
            mail:
                smtp:
                    auth: false
                    starttls:
                        enable: false

# Management & Health Checks (Actuator)
management:
    endpoints:
        web:
            exposure:
                include: health,info,metrics
    endpoint:
        health:
            show-details: always
